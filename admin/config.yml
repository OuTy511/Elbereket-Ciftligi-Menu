# إعدادات لوحة التحكم الخاصة بـ Decap CMS
# يمكن تعديل هذا الملف لإضافة مجموعات أو حقول جديدة حسب الحاجة.
backend:
  name: github
  repo: OuTy511/Elbereket-Ciftligi-Menu
  branch: main

media_folder: "img/uploads" # مكان حفظ الصور داخل المستودع
public_folder: "/img/uploads" # المسار العام الذي تستخدمه الواجهة الأمامية

publish_mode: editorial_workflow # لتفعيل نظام المراجعة قبل النشر

collections:
  - name: "products"
    label: "المنتجات"
    label_singular: "منتج"
    description: "إدارة قائمة منتجات مزارع البركات بالكامل من مكان واحد."
    editor:
      preview: false
    files:
      - file: "data/products.json"
        label: "قائمة المنتجات"
        name: "menu_products"
        description: |
          هذا الملف يحتوي على جميع المنتجات المعروضة في المنيو.
          بعد الضغط على "Publish" سيتم إنشاء commit جديد ويُعاد بناء الموقع تلقائيًا على Netlify.
        fields:
          - label: "المنتجات"
            name: "products"
            widget: "list"
            summary: "{{fields.name_ar}} — {{fields.category_ar}}"
            allow_add: true
            collapsed: true
            fields:
              - label: "متاح في المنيو"
                name: "available"
                widget: "boolean"
                default: true
                hint: "عطّل هذا الخيار لإخفاء المنتج من المنيو بدون حذفه."
              - label: "كود المنتج"
                name: "code"
                widget: "string"
                hint: "استخدم كودًا فريدًا لكل منتج (يظهر في رسائل الطلب)."
              - label: "المعرّف الداخلي"
                name: "id"
                widget: "string"
                required: false
                hint: "يُفضّل أن يساوي الكود. اتركه فارغًا ليتم توليده من الاسم."
              - label: "الاسم (عربي)"
                name: "name_ar"
                widget: "string"
              - label: "الاسم (تركي)"
                name: "name_tr"
                widget: "string"
                required: false
              - label: "معرّف القسم"
                name: "category_id"
                widget: "string"
                required: false
                hint: "ثبّت نفس القيمة لكل المنتجات التي تنتمي لنفس القسم."
              - label: "القسم (عربي)"
                name: "category_ar"
                widget: "string"
              - label: "القسم (تركي)"
                name: "category_tr"
                widget: "string"
                required: false
              - label: "السعر"
                name: "price"
                widget: "number"
                min: 0
                step: 1
              - label: "سعر العرض"
                name: "discount_price"
                widget: "number"
                min: 0
                step: 1
                required: false
                hint: "اتركه 0 إذا لم يكن هناك عرض."
              - label: "الوحدة الظاهرة بجانب السعر"
                name: "unit"
                widget: "string"
                default: "TL/kg"
                hint: "مثال: TL/kg أو TL"
              - label: "وضع البيع"
                name: "sell_mode"
                widget: "select"
                options:
                  - { label: "بالقطعة", value: 0 }
                  - { label: "بالكيلو", value: 1 }
                  - { label: "ذبيحة كاملة (سعر/كجم)", value: 2 }
                default: 0
              - label: "وزن تقريبي (كجم)"
                name: "approx_kg"
                widget: "number"
                min: 0
                step: 0.1
                required: false
              - label: "صورة المنتج"
                name: "image"
                widget: "image"
                hint: "تُرفع الصورة تلقائيًا إلى مجلد img/uploads."
              - label: "وصف المنتج"
                name: "description"
                widget: "text"
                required: false
              - label: "خيارات التقطيع"
                name: "cuts"
                widget: "list"
                required: false
                collapsed: true
                summary: "{{fields.name_ar}}"
                fields:
                  - label: "معرّف الخيار"
                    name: "id"
                    widget: "string"
                    required: false
                  - label: "الاسم (عربي)"
                    name: "name_ar"
                    widget: "string"
                  - label: "الاسم (تركي)"
                    name: "name_tr"
                    widget: "string"
                    required: false
